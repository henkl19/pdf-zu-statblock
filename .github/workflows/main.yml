name: Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract OCR
        shell: pwsh
        run: choco install tesseract --yes --no-progress
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AtlasMonsterImporter `
            --add-binary "C:\Program Files\Tesseract-OCR\tesseract.exe;." `
            --add-data "C:\Program Files\Tesseract-OCR\tessdata;tessdata" `
            atlas_importer.py
      - uses: actions/upload-artifact@v4
        with:
          name: AtlasMonsterImporter-Windows
          path: dist/AtlasMonsterImporter.exe
